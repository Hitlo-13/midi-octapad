name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Directory & Assets
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MIDI Octapad" "com.hitlo.midioctapad" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Configure Keystore & Release Signing
        run: |
          # Create official release keystore
          keytool -genkeypair -v -keystore android/app/release.keystore -alias octapad -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Hitlo, OU=App, O=Dev, L=City, S=State, C=IN"
          
          # Inject signing config directly into Gradle so it signs v1, v2 & v3 automatically
          cat << 'EOF' > update_build.py
          with open("android/app/build.gradle", "r") as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword '123456'
                      keyAlias 'octapad'
                      keyPassword '123456'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
          """
          content = content.replace("android {", "android {\n" + signing_block)
          content = content.replace("buildTypes {\n        release {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release")

          with open("android/app/build.gradle", "w") as f:
              f.write(content)
          EOF
          python3 update_build.py

      - name: Build Signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIDI-Octapad-Vivo-Ready
          path: android/app/build/outputs/apk/release/app-release.apk
