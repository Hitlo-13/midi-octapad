name: Build MIDI Octapad APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MIDI Octapad" "com.hitlo.midioctapad" --web-dir www
          npx cap add android

      - name: Fix BouncyCastle & Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          # --no-parallel se jar collision/corruption khatam ho jati hai
          ./gradlew assembleDebug --no-daemon --no-parallel --refresh-dependencies

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MIDI-Octapad-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
