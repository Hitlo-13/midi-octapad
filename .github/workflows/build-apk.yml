name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Prepare Web Directory & Assets
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MIDI Octapad" "com.hitlo.midioctapad" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Fix Target and Min SDK for Android 13
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 33/' android/variables.gradle || true

      - name: Build and Sign APK with v2/v3 Signatures
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          
          # Keystore generate karna
          keytool -genkeypair -v -keystore release.jks -alias octapad -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Hitlo, OU=App, O=Dev, L=City, S=State, C=IN"
          
          # Align aur official apksigner (v2+v3 sign)
          BUILD_TOOLS_PATH=$ANDROID_HOME/build-tools/34.0.0
          $BUILD_TOOLS_PATH/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BUILD_TOOLS_PATH/apksigner sign --ks release.jks --ks-pass pass:123456 --ks-key-alias octapad --key-pass pass:123456 --out MIDI-Octapad.apk aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIDI-Octapad-Installable-APK
          path: android/MIDI-Octapad.apk
